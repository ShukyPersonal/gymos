<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Exercise Icons</title>
<style>
  body { background: #f0f0f0; font-family: sans-serif; padding: 40px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; max-width: 700px; }
  .card {
    background: white; border-radius: 16px; padding: 20px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .card img { width: 100px; height: 100px; object-fit: contain; border-radius: 8px; }
  .card span { font-size: 12px; color: #444; text-align: center; font-weight: 500; }
</style>
</head>
<body>
<div class="grid">
  <div class="card"><img src="../assets/exercises/incline_bench_press.png"><span>Incline Bench Press 30°</span></div>
  <div class="card"><img src="../assets/exercises/assisted_pullups.png"><span>Assisted Pull-ups</span></div>
  <div class="card"><img src="../assets/exercises/incline_flyes.png"><span>Incline Chest Flyes 30°</span></div>
  <div class="card"><img src="../assets/exercises/lateral_raises.png"><span>Lateral Raises</span></div>
  <div class="card"><img src="../assets/exercises/hammer_curls.png"><span>Hammer Curls</span></div>
  <div class="card"><img src="../assets/exercises/dragon_flag.png"><span>Dragon Flag</span></div>
  <div class="card"><img src="../assets/exercises/walking_lunges.png"><span>Walking Lunges</span></div>
</div>
</body>
</html>
