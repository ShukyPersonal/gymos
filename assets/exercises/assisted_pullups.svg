<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- pull-up bar -->
  <rect x="15" y="10" width="70" height="6" rx="3" fill="#1A1A1A"/>
  <!-- hands gripping bar -->
  <rect x="30" y="14" width="8" height="10" rx="3" fill="#1A1A1A"/>
  <rect x="62" y="14" width="8" height="10" rx="3" fill="#1A1A1A"/>
  <!-- arms -->
  <line x1="34" y1="22" x2="42" y2="38" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
  <line x1="66" y1="22" x2="58" y2="38" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="50" cy="32" r="7" fill="#1A1A1A"/>
  <!-- torso -->
  <rect x="43" y="38" width="14" height="22" rx="5" fill="#1A1A1A"/>
  <!-- legs hanging -->
  <line x1="47" y1="60" x2="44" y2="82" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
  <line x1="53" y1="60" x2="56" y2="82" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
  <!-- feet -->
  <line x1="44" y1="82" x2="38" y2="86" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>
  <line x1="56" y1="82" x2="62" y2="86" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>
</svg>
