<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- head -->
  <circle cx="50" cy="14" r="8" fill="#1A1A1A"/>
  <!-- torso upright -->
  <rect x="44" y="22" width="12" height="24" rx="4" fill="#1A1A1A"/>
  <!-- arms holding dumbbells down -->
  <line x1="44" y1="28" x2="30" y2="46" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
  <line x1="56" y1="28" x2="70" y2="46" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
  <!-- dumbbells -->
  <rect x="23" y="44" width="9" height="6" rx="2" fill="#1A1A1A"/>
  <rect x="68" y="44" width="9" height="6" rx="2" fill="#1A1A1A"/>
  <!-- front leg (bent knee lunge) -->
  <line x1="47" y1="46" x2="34" y2="64" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
  <line x1="34" y1="64" x2="28" y2="84" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
  <!-- back leg (extended behind) -->
  <line x1="53" y1="46" x2="66" y2="62" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
  <line x1="66" y1="62" x2="76" y2="82" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
  <!-- feet -->
  <line x1="28" y1="84" x2="18" y2="88" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>
  <line x1="76" y1="82" x2="84" y2="88" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>
</svg>
