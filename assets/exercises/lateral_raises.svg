<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- head -->
  <circle cx="50" cy="18" r="8" fill="#1A1A1A"/>
  <!-- torso -->
  <rect x="43" y="26" width="14" height="26" rx="5" fill="#1A1A1A"/>
  <!-- arms raised sideways -->
  <line x1="43" y1="34" x2="14" y2="44" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
  <line x1="57" y1="34" x2="86" y2="44" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
  <!-- dumbbells -->
  <rect x="5" y="40" width="10" height="8" rx="2" fill="#1A1A1A"/>
  <rect x="85" y="40" width="10" height="8" rx="2" fill="#1A1A1A"/>
  <!-- legs -->
  <line x1="47" y1="52" x2="44" y2="78" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
  <line x1="53" y1="52" x2="56" y2="78" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
  <!-- feet -->
  <line x1="44" y1="78" x2="36" y2="82" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>
  <line x1="56" y1="78" x2="64" y2="82" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>
</svg>
