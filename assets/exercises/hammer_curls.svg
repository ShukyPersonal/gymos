<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- head -->
  <circle cx="50" cy="16" r="8" fill="#1A1A1A"/>
  <!-- torso -->
  <rect x="43" y="24" width="14" height="28" rx="5" fill="#1A1A1A"/>
  <!-- left arm down -->
  <line x1="43" y1="30" x2="28" y2="50" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
  <!-- left forearm down (relaxed) -->
  <line x1="28" y1="50" x2="28" y2="70" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
  <!-- right arm, forearm curled up -->
  <line x1="57" y1="30" x2="72" y2="42" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
  <line x1="72" y1="42" x2="60" y2="28" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
  <!-- dumbbell right (vertical = hammer grip) -->
  <rect x="55" y="18" width="7" height="14" rx="2" fill="#1A1A1A"/>
  <!-- dumbbell left (at bottom) -->
  <rect x="23" y="68" width="7" height="14" rx="2" fill="#1A1A1A"/>
  <!-- legs -->
  <line x1="47" y1="52" x2="44" y2="78" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
  <line x1="53" y1="52" x2="56" y2="78" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
</svg>
