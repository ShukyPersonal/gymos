<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- bench -->
  <rect x="8" y="70" width="84" height="8" rx="3" fill="#1A1A1A"/>
  <!-- head/shoulders gripping bench top -->
  <circle cx="18" cy="60" r="7" fill="#1A1A1A"/>
  <!-- arms holding bench behind head -->
  <line x1="13" y1="64" x2="8" y2="72" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>
  <line x1="23" y1="64" x2="28" y2="72" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>
  <!-- body raised horizontal (flag) -->
  <rect x="24" y="52" width="52" height="12" rx="5" fill="#1A1A1A"/>
  <!-- legs together extended -->
  <rect x="72" y="48" width="20" height="10" rx="4" fill="#1A1A1A"/>
  <!-- feet -->
  <line x1="90" y1="50" x2="96" y2="48" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="56" x2="96" y2="58" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>
</svg>
